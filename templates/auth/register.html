{% extends 'base.html' %}

{% block title %}Customer Register - SmartRide{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4">
                    <h4 class="fw-bold mb-1"><i class="bi bi-person-plus text-warning me-2"></i>Create Customer Account</h4>
                    <p class="small text-muted mb-0">Join SmartRide for quick and easy vehicle rentals</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" name="full_name" class="form-control" placeholder="e.g. John Doe" value="{{ full_name or '' }}" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                                <input type="tel" name="phone" class="form-control" placeholder="e.g. 9876543210" value="{{ phone or '' }}" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="Min. 6 chars" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                                    <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-3 rounded-3 fw-bold mb-3 shadow">
                            <i class="bi bi-check-circle me-2"></i>Create Account
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-bold">Login Here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
